name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Plugin registration (io_types / register_io_type) is ahead of PyPI
        # lynguine 0.1.2. Install current main until the next cut is published.
        pip install "git+https://github.com/lawrennd/lynguine.git@main"
        # oauth extra: msal for XOAUTH2 path coverage in tests/test_oauth.py
        pip install -e ".[oauth]"
        pip install pytest
    - name: Run tests with pytest
      run: |
        pytest
