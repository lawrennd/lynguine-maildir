[tool.poetry]
name = "lynguine-maildir"
version = "0.1.0"
description = "Maildir, mu, and live IMAP message subjects as a lynguine tabular IO type."
authors = ["Neil D. Lawrence <lawrennd@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "lynguine_maildir"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
lynguine = ">=0.1.2"
pandas = "*"
msal = {version = "*", optional = true}

[tool.poetry.extras]
oauth = ["msal"]

[tool.poetry.scripts]
lynguine-maildir-login = "lynguine_maildir.login:main"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poetry.plugins."lynguine.io_types"]
imap = "lynguine_maildir"
maildir = "lynguine_maildir"
mu = "lynguine_maildir"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
